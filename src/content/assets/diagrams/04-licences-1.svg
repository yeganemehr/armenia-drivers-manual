<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Five steps rising from left to right, each topped by a licence card showing an age: 16, 17, 18, 19 and 21">
  <rect width="640" height="240" fill="#f4f6f8"/>
  <g fill="#8d99a6">
    <rect x="20" y="194" width="120" height="26"/>
    <rect x="140" y="166" width="120" height="54"/>
    <rect x="260" y="138" width="120" height="82"/>
    <rect x="380" y="110" width="120" height="110"/>
    <rect x="500" y="82" width="120" height="138"/>
  </g>
  <g fill="#fff" stroke="#2f6fd0" stroke-width="5">
    <rect x="44" y="138" width="72" height="50" rx="7"/>
    <rect x="164" y="110" width="72" height="50" rx="7"/>
    <rect x="284" y="82" width="72" height="50" rx="7"/>
    <rect x="404" y="54" width="72" height="50" rx="7"/>
    <rect x="524" y="26" width="72" height="50" rx="7"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" text-anchor="middle" fill="#111">
    <text x="80" y="172">16</text><text x="200" y="144">17</text><text x="320" y="116">18</text><text x="440" y="88">19</text><text x="560" y="60">21</text>
  </g>
</svg>
